<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Use It Up</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#222;--mute:#777;--green:#2f7d4f;--amber:#e0a100;--red:#c8372d;--line:#e4e2da}
@media (prefers-color-scheme:dark){:root{--bg:#161814;--card:#22251f;--ink:#eee;--mute:#999;--line:#33362e}}
*{box-sizing:border-box}
/* --nav-pad: space under the tab labels: half the iPhone home-indicator inset plus a little extra (a compromise: not jammed, not tall) */
:root{--nav-pad:calc(env(safe-area-inset-bottom) * .5 + 6px)}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(56px + var(--nav-pad) + 24px)}
header{background:var(--green);color:#fff;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.aipill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.2);cursor:pointer}
.aipill:empty{display:none}
.aipill.offline{background:#c8372d}
.aipill.warming{background:#e0a100;color:#222}
#toast{position:fixed;left:50%;bottom:calc(76px + var(--nav-pad));transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.show{opacity:1}
main{max-width:640px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) var(--nav-pad) env(safe-area-inset-left);z-index:10}
nav button{flex:1;min-height:50px;padding:11px 4px;border:0;background:none;color:var(--mute);font-size:14px}
nav button.on{color:var(--green);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.item{display:flex;align-items:center;gap:8px}
.item .name{flex:1;font-weight:600}
.item .qty{color:var(--mute);font-weight:400}
.badge{padding:3px 9px;border-radius:99px;font-size:13px;color:#fff;white-space:nowrap}
.ok{background:var(--green)}.soon{background:var(--amber)}.bad{background:var(--red)}
button.b,input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.b{background:var(--green);color:#fff;border:0;font-weight:600}
button.b.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.b.sm{padding:6px 10px;font-size:14px}
button.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row>*{flex:1}
label{font-size:13px;color:var(--mute);display:block;margin-top:8px}
input{width:100%}
video{width:100%;border-radius:12px;background:#000}
.banner{background:#fff3cd;color:#5c4400;border-radius:12px;padding:10px 12px;margin:10px 0}
.muted{color:var(--mute);font-size:14px}
.recipe{display:flex;gap:10px;text-decoration:none;color:inherit}
.recipe img{width:76px;height:76px;border-radius:10px;object-fit:cover}
.ai{white-space:pre-wrap}
.hide{display:none}
.soonbar{background:#fff3cd;color:#5c4400;padding:9px 16px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0dc9b}
.soonbar.red{background:#f8d7da;color:#721c24;border-bottom-color:#efb7bd}
.sum{border-left:4px solid var(--amber)}
.sum div{margin:3px 0}
#joinbox{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.card.join{border:2px solid var(--green)}
.ingb{font:inherit;color:inherit;background:none;border:0;padding:2px 0;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
#fixbox{position:fixed;left:0;right:0;bottom:calc(56px + var(--nav-pad));z-index:15;max-width:640px;margin:0 auto;padding:0 12px}
.card.fix{border:2px solid var(--amber);box-shadow:0 -4px 18px rgba(0,0,0,.25)}
.syncwarn{background:#fff3cd;color:#5c4400;border-radius:10px;padding:6px 10px;margin:6px 0;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header><span>🥕 Use It Up</span><span id="aipill" class="aipill"></span></header>
<div id="toast"></div>
<div id="soon" class="hide" role="button" tabindex="0"></div>
<div id="joinbox"></div>
<div id="fixbox"></div>
<main id="main"></main>
<nav>
  <button data-t="list">Pantry</button>
  <button data-t="add">Add</button>
  <button data-t="recipes">Recipes</button>
  <button data-t="more">More</button>
</nav>

<script src="match.js"></script>
<script>
// ---------- storage ----------
const KEY = 'useitup.items.v1', HKEY = 'useitup.hist.v1', CKEY = 'useitup.llm';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let items = load(KEY, []), hist = load(HKEY, []);
const TKEY = 'useitup.tomb', SKEY = 'useitup.sync';
let tomb = load(TKEY, {});   // ids of deleted items -> time deleted (so a deletion on one phone reaches the others)
const newId = () => Math.random().toString(36).slice(2, 9) + Math.random().toString(36).slice(2, 9);
hist = hist.map(h => h.id ? h : { ...h, id: newId() });
// The household's ingredient-match fixes ("parmigiano counts as parmesan", "pepper is not bell pepper"). Synced like items:
// each rule is immutable with an id; removing one leaves a tombstone.
const RKEY = 'useitup.rules';
let rules = load(RKEY, []);
const saveLocal = () => { put(KEY, items); put(HKEY, hist); put(TKEY, tomb); put(RKEY, rules); };
const save = () => { saveLocal(); scheduleSync(); };

// ---------- shared pantry sync (small server on your PC; see tools/sync-server.py) ----------
// Items never change after they're added, so syncing is just a union minus deletions: no conflicts.
const syncCfg = () => load(SKEY, null);
// lastOk / failSince are kept across app restarts so "Last synced" and the "failing for X min" warning stay honest.
const sync = { status: 'off', at: 0, msg: '', ...load('useitup.syncstate', {}) };
const SYNC_WARN_MS = 10 * 60e3;
const keepSyncState = () => put('useitup.syncstate', { lastOk: sync.lastOk || 0, failSince: sync.failSince || 0 });
const syncFailingLong = () => !!syncCfg() && sync.status === 'err' && sync.failSince && Date.now() - sync.failSince > SYNC_WARN_MS;
function whenStr(t) {
  if (!t) return 'never';
  const d = new Date(t), time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (isoLocal(d) === isoLocal(new Date())) return time;
  if (isoLocal(d) === isoLocal(new Date(Date.now() - DAY))) return 'yesterday ' + time;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + time;
}
let syncing = false, syncAgain = false, syncTimer = 0;
const TOMB_KEEP = 120 * 24 * 3600 * 1000;
function mergeIn(r) {
  const before = JSON.stringify([items.map(i => i.id).sort(), hist.length, rules.map(x => x.id).sort()]);
  const now = Date.now(), t = { ...tomb };
  for (const [k, v] of Object.entries(r.tomb || {})) if (typeof v === 'number') t[k] = Math.max(t[k] || 0, v);
  for (const k of Object.keys(t)) if (now - t[k] > TOMB_KEEP) delete t[k];
  const im = new Map();
  for (const i of [...(r.items || []), ...items]) if (i && i.id && !t[i.id] && !im.has(i.id)) im.set(i.id, i);
  const hm = new Map();
  for (const h of [...(r.hist || []), ...hist]) if (h && h.id && !hm.has(h.id)) hm.set(h.id, h);
  const rm = new Map();
  for (const x of [...(r.rules || []), ...rules]) if (x && x.id && !t[x.id] && !rm.has(x.id)) rm.set(x.id, x);
  tomb = t; items = [...im.values()]; hist = [...hm.values()].sort((a, b) => (a.date || '').localeCompare(b.date || '')); rules = [...rm.values()];
  const remoteIds = new Set((r.items || []).map(i => i.id)), remoteRules = new Set((r.rules || []).map(x => x.id));
  const extra = items.some(i => !remoteIds.has(i.id)) || (r.hist || []).length < hist.length || rules.some(x => !remoteRules.has(x.id));
  return { changed: before !== JSON.stringify([items.map(i => i.id).sort(), hist.length, rules.map(x => x.id).sort()]), extra };
}
function scheduleSync() { if (!syncCfg()) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 700); }
async function syncNow() {
  const c = syncCfg(); if (!c || !c.url || !c.code) { sync.status = 'off'; return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; sync.status = 'busy';
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 10000);
  try {
    const res = await fetch(c.url.trim().replace(/\/+$/, '') + '/' + encodeURIComponent(c.code), { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ items, hist, tomb, rules }), signal: ac.signal });
    if (!res.ok) throw new Error(res.status === 400 ? 'the pantry code looks wrong' : res.status === 502 || res.status === 503 ? "the sync server isn't running on the PC" : res.status === 404 ? 'wrong address (it should end in /sync)' : 'server said ' + res.status);
    const r = await res.json(), m = mergeIn(r);
    saveLocal(); sync.status = 'ok'; sync.at = sync.lastOk = Date.now(); sync.msg = ''; sync.failSince = 0; keepSyncState();
    if (m.extra) syncAgain = true;   // something was added while we were talking to the server
    if (m.changed) { if (tab === 'list') render(); else updateSoon(); }
  } catch (e) {
    if (!sync.failSince) { sync.failSince = Date.now(); keepSyncState(); }
    sync.status = 'err'; sync.msg = e.name === 'AbortError' ? 'timed out (is the PC on and Tailscale connected?)' : e.message === 'Failed to fetch' || e.message === 'Load failed' ? "can't reach the PC (is Tailscale on? is the PC on?)" : e.message;
  } finally { clearTimeout(to); syncing = false; paintSync(); if (syncAgain) { syncAgain = false; setTimeout(syncNow, 300); } }
}
function paintSync() {
  const w = $('syncwarn');   // small warning on the Pantry tab
  if (w) w.innerHTML = syncFailingLong() ? `<div class="syncwarn" id="syncwarnbtn">⚠️ Not synced for ${Math.round((Date.now() - sync.failSince) / 60e3)} min — changes stay on this phone. Last synced: ${esc(whenStr(sync.lastOk))}</div>` : '';
  if ($('syncwarnbtn')) $('syncwarnbtn').onclick = () => go('more');
  const el = $('syncstat'); if (!el) return; const c = syncCfg();
  if (!c) { el.textContent = 'Not syncing — this phone keeps its own pantry.'; return; }
  const last = `Last synced: <b>${esc(whenStr(sync.lastOk))}</b>`;
  el.innerHTML = sync.status === 'busy' ? `Syncing… · ${last}`
    : sync.status === 'ok' ? `${last} ✓`
    : sync.status === 'err' ? `${last}<br>Not synced right now: ${esc(sync.msg)}. Your changes are kept on this phone and will sync when the PC is reachable.`
      + (syncFailingLong() ? `<div class="syncwarn">⚠️ Sync has been failing for ${Math.round((Date.now() - sync.failSince) / 60e3)} minutes. Check that Tailscale is on and the PC is awake.</div>` : '')
    : `Waiting to sync… · ${last}`;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', syncNow);
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 60000);
// firstToken: seconds to wait for the first word before switching to the fallback model. overall: hard cap per call.
// numCtx: context window sent to Ollama (smaller = less GPU memory; the app's prompts are short). keepAlive: how long Ollama keeps the model loaded.
// coldGrace: extra seconds allowed when the model isn't in GPU memory yet. The models live on a spinning disk (D:):
// qwen2.5:14b took 112–116 s to load in testing (docs/benchmarks.md), so allow 150 s rather than fall back to the 7b.
// keepAlive: every request resets Ollama's unload timer to this value, so it must not be shorter than the PC's preloader (4h).
const getCfg = () => { const c = load(CKEY, {}); if (c.keepAlive === '30m') delete c.keepAlive;   // old default -> new default
  return { url: 'http://localhost:11434', model: 'qwen2.5:14b', fallback: 'qwen2.5:7b', firstToken: 15, coldGrace: 150, overall: 300, numCtx: 2048, keepAlive: '4h', ...c }; };
const uid = () => Math.random().toString(36).slice(2, 9);

// ---------- dates ----------
const DAY = 864e5;
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = n => { const d = today0(); d.setDate(d.getDate() + n); return isoLocal(d); };
const daysLeft = iso => Math.round((new Date(iso + 'T00:00:00') - today0()) / DAY);
function badge(iso) {
  const n = daysLeft(iso);
  const cls = n < 0 ? 'bad' : n <= 2 ? 'soon' : 'ok';
  const txt = n < 0 ? `expired ${-n}d ago` : n === 0 ? 'today!' : n === 1 ? 'tomorrow' : `${n} days`;
  return `<span class="badge ${cls}">${txt}</span>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

// ---------- Local AI (Ollama running on your own PC) ----------
// Works out *why* Ollama can't be used, from the HTTP status (or lack of one), so the message says what to fix.
const HINTS = {
  network: "This device couldn't reach your PC. Check that Tailscale is switched ON on this device, the PC is on and awake, and the address is exactly https://<pc>.<tailnet>.ts.net/ollama.",
  'proxy-down': "Your PC answered (HTTP %s) but nothing is behind that address — the Use-It-Up proxy or Ollama isn't running. On the PC, start Ollama and run tools\\install-proxy-autostart.ps1.",
  'host-rejected': "Ollama refused the hostname (HTTP 403). The Tailscale route is pointing straight at Ollama; point it at the proxy: tailscale serve --bg --set-path /ollama http://127.0.0.1:11436",
  'wrong-path': "Reached a server, but not Ollama at that path (HTTP 404). The address should end in /ollama.",
  auth: "That address asks for a login (HTTP %s) — it's a different app than Ollama.",
  'not-ollama': "Reached something that isn't Ollama (the reply wasn't Ollama's model list).",
  http: "Unexpected reply from the server (HTTP %s)."
};
async function pingOllama(url, ms = 8000) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url.replace(/\/+$/, '') + '/api/tags', { signal: ctl.signal });
    const s = r.status;
    if (s === 200) {
      const j = await r.json().catch(() => null);
      return Array.isArray(j?.models) ? { ok: true, kind: 'ok', status: s, models: j.models.map(m => m.name) } : { ok: false, kind: 'not-ollama', status: s, hint: HINTS['not-ollama'] };
    }
    const kind = [502, 503, 504].includes(s) ? 'proxy-down' : s === 403 ? 'host-rejected' : s === 404 ? 'wrong-path' : [401, 407].includes(s) ? 'auth' : 'http';
    return { ok: false, kind, status: s, hint: HINTS[kind].replace('%s', s) };
  } catch (e) {
    return { ok: false, kind: 'network', status: 0, hint: HINTS.network, timedOut: e.name === 'AbortError' };
  } finally { clearTimeout(timer); }
}
let lastModel = '', lastStats = null, lastFallbackWhy = '';
const mkErr = (msg, retry, extra = {}) => Object.assign(new Error(msg), { retry, mine: true }, extra);
// One streamed chat call. Gives up (so the fallback model can be tried) if the first token hasn't arrived within firstSecs.
async function llmOnce(model, prompt, max, firstSecs, json = false) {
  const { url, numCtx, keepAlive, overall } = getCfg();
  const ctl = new AbortController(), t0 = performance.now();
  let why = '', gotFirst = false, ttft = null;
  const firstTimer = setTimeout(() => { why = 'first'; ctl.abort(); }, firstSecs * 1000);
  const overallTimer = setTimeout(() => { why = 'overall'; ctl.abort(); }, overall * 1000);
  try {
    const r = await fetch(url.replace(/\/+$/, '') + '/api/chat', {
      method: 'POST', signal: ctl.signal, headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ model, stream: true, keep_alive: keepAlive, ...(json ? { format: 'json' } : {}), messages: [{ role: 'user', content: prompt }],
        options: { num_predict: max, temperature: json ? 0.3 : 0.5, ...(numCtx ? { num_ctx: numCtx } : {}) } })
    });
    if (!r.ok) {   // e.g. model missing or out of memory (Ollama sends {error}); 502/504 means the proxy/Ollama is down
      const j = await r.json().catch(() => ({}));
      const kind = [502, 503, 504].includes(r.status) ? 'proxy-down' : r.status === 403 ? 'host-rejected' : 'http';
      throw mkErr(j.error || HINTS[kind].replace('%s', r.status), ![502, 503, 504, 403].includes(r.status), { status: r.status });   // the fallback model would hit the same dead end
    }
    let text = '', fin = null;
    const handle = line => {
      if (!line.trim()) return;
      let j; try { j = JSON.parse(line); } catch (e) { return; }
      if (j.error) throw mkErr(j.error, true);
      const c = j.message?.content;
      if (c) { if (!gotFirst) { gotFirst = true; clearTimeout(firstTimer); ttft = (performance.now() - t0) / 1000; } text += c; }
      if (j.done) fin = j;
    };
    if (r.body && r.body.getReader) {
      const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) { const { value, done } = await reader.read(); if (done) break; buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop(); lines.forEach(handle); }
      handle(buf);
    } else { (await r.text()).split('\n').forEach(handle); gotFirst = true; ttft = (performance.now() - t0) / 1000; }
    if (!text) throw mkErr(`${model} sent back an empty reply`, true);
    lastModel = model;
    lastStats = { model, ttft, total: (performance.now() - t0) / 1000, tokens: fin?.eval_count ?? null, tps: fin?.eval_duration ? fin.eval_count / (fin.eval_duration / 1e9) : null, loadSecs: fin?.load_duration ? fin.load_duration / 1e9 : null };
    return text;
  } catch (e) {
    if (e.mine) throw e;
    if (why === 'first') throw mkErr(`${model} gave no answer within ${firstSecs}s`, true);
    if (why === 'overall') throw mkErr(`${model} was still going after ${overall}s`, true);
    throw mkErr(`Can't reach Ollama at ${url}. Is it running on your PC, and is the address right? (See More.)`, false, { fatal: true });
  } finally { clearTimeout(firstTimer); clearTimeout(overallTimer); }
}
// Loads the model into GPU memory in the background so the first real request isn't slow.
let warmedAt = 0;
function warm(force = false) {
  if (!force && Date.now() - warmedAt < 5 * 60e3) return;
  warmedAt = Date.now();
  const { url, model, keepAlive, numCtx } = getCfg();
  loadedModels().then(l => { if (l && !l.includes(model)) setWarming(true); });   // only show "warming" if it really is cold
  fetch(url.replace(/\/+$/, '') + '/api/generate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ model, keep_alive: keepAlive, ...(numCtx ? { options: { num_ctx: numCtx } } : {}) }) })
    .then(r => { setWarming(false, r.ok); }).catch(() => { warmedAt = 0; setWarming(false); });
}
// Which models Ollama currently has in GPU memory (null if it can't be asked).
async function loadedModels() {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3000);
  try { const r = await fetch(getCfg().url.replace(/\/+$/, '') + '/api/ps', { signal: ctl.signal }); const j = await r.json(); return (j.models || []).map(m => m.name); }
  catch (e) { return null; } finally { clearTimeout(t); }
}
let onAiPhase = null;   // optional UI hook: called with 'loading' (model not in memory yet) or 'thinking'
// Tries the main model. A model that is already loaded must produce its first token within firstToken seconds; one that
// still has to be loaded from disk gets coldGrace extra seconds (waiting beats switching to a fallback that is also cold).
// On timeout / error / out of memory / missing model, retries once with the fallback model.
async function llmCore(prompt, max = 900, json = false) {
  const { model, fallback, firstToken, coldGrace } = getCfg();
  lastFallbackWhy = '';
  const loaded = await loadedModels();
  const grace = name => (loaded && !loaded.includes(name)) ? coldGrace : 0;
  onAiPhase && onAiPhase(grace(model) ? 'loading' : 'thinking');
  if (grace(model)) setWarming(true);
  try { const t = await llmOnce(model, prompt, max, firstToken + grace(model), json); setWarming(false, true); return t; }
  catch (e) {
    setWarming(false);
    if (!e.retry || !fallback || fallback === model) throw e;
    try { onAiPhase && onAiPhase(grace(fallback) ? 'loading' : 'thinking'); const t = await llmOnce(fallback, prompt, max, firstToken * 2 + grace(fallback), json); lastFallbackWhy = e.message; return t; }
    catch (e2) { throw Object.assign(new Error(`${e.message}; fallback ${fallback} also failed: ${e2.message}`), { fatal: e.fatal || e2.fatal, status: e2.status ?? e.status }); }
  }
}
// Public entry point: same as llmCore, but keeps the app's "AI online / offline" state up to date.
async function llm(prompt, max = 900, json = false) {
  try { const t = await llmCore(prompt, max, json); if (ai.state !== 'online') setAi(true); return t; }
  catch (e) { if (e.fatal || [502, 503, 504, 403].includes(e.status)) setAi(false, e.message); throw e; }
}

// ---------- AI availability: offline state, background retry, automatic switch back ----------
const ai = { state: 'unknown', hint: '', retryMs: 15000, timer: null, warming: false };
function paintAiPill() {
  const el = $('aipill'); if (!el) return;
  const warming = ai.warming && ai.state !== 'offline';
  el.textContent = warming ? 'AI warming up…' : ai.state === 'online' ? 'AI ●' : ai.state === 'offline' ? 'AI offline' : '';
  el.className = 'aipill ' + (warming ? 'warming' : ai.state);
}
// "Warming up" = the PC is loading the model from disk (up to ~2 min). That's not an error, so say so.
function setWarming(on, ready = false) {
  const was = ai.warming; ai.warming = on; paintAiPill();

function loadZXing() {
  return new Promise((res, rej) => {
    if (window.ZXingBrowser) return res();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Could not load the scanner library (offline?).'));
    document.head.appendChild(s);

function gotCode(c) {
  stopScan(); $('code').value = c; draft.barcode = c; $('vid').classList.add('hide'); lookup(c);
}
async function startScan() {
  const msg = $('msg'), vid = $('vid');
  if (!navigator.mediaDevices?.getUserMedia) { msg.textContent = 'Camera needs a secure (https) page. Type the barcode instead.'; return; }
  try {
    vid.classList.remove('hide');
    if ('BarcodeDetector' in window) {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      vid.srcObject = stream; await vid.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      msg.textContent = 'Point at a barcode…';
      scanTimer = setInterval(async () => {
        try { const r = await det.detect(vid); if (r.length) gotCode(r[0].rawValue); } catch (e) {}
      }, 300);
    } else {
      msg.textContent = 'Loading scanner…';
      await loadZXing();
      const reader = new ZXingBrowser.BrowserMultiFormatReader();
      msg.textContent = 'Point at a barcode…';
      zxControls = await reader.decodeFromConstraints({ video: { facingMode: 'environment' } }, vid, (result) => { if (result) gotCode(result.getText()); });
    }
  } catch (e) { vid.classList.add('hide'); msg.textContent = 'Camera unavailable: ' + e.message; }
}

async function lookup(code) {
  const msg = $('msg');
  if (!code) { msg.textContent = 'Enter a barcode first.'; return; }
  msg.textContent = 'Looking up…';
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,categories_tags`);
    const j = await r.json();
    if (j.status !== 1) { msg.textContent = 'Not found — type the name yourself.'; return; }
    const p = j.product;
    $('name').value = draft.name = [p.product_name, p.brands && '(' + p.brands.split(',')[0] + ')'].filter(Boolean).join(' ');
    draft.barcode = code; draft.leftover = false;
    const cats = (p.categories_tags || []).join(' ');
    const days = /meat|poultry|fish|seafood/.test(cats) ? 3 : /milk|dairy|yogurt|cheese/.test(cats) ? 10 : /bread|bakery/.test(cats) ? 5 : /fruit|vegetable/.test(cats) ? 5 : 14;
    $('exp').value = draft.expires = addDays(days);
    msg.textContent = `Found it. I guessed ${days} days — change to match the package.`;
  } catch (e) { msg.textContent = 'Lookup failed (offline?). Type the name yourself.'; }
}

const MEAL = 'https://www.themealdb.com/api/json/v1/1/';

async function getIngredients() {
  if (ingList) return ingList;
  ingList = load('useitup.ing', null);
  if (!ingList) {
    const j = await (await fetch(MEAL + 'list.php?i=list')).json();
    ingList = j.meals.map(m => m.strIngredient.toLowerCase());

}
const sing = w => w.replace(/ies$/, 'y').replace(/(ch|sh|x|s)es$/, '$1').replace(/s$/, '');

  const words = name.toLowerCase().replace(/\(.*?\)/g, '').split(/[^a-z]+/).filter(w => w.length > 2).map(sing);
  for (const w of words.slice().reverse()) { const exact = list.find(i => i === w); if (exact) return exact; }
  const phrase = words.join(' ');
  return list.find(i => phrase.includes(i) && i.length > 3) || null;
}
// ---- check recipe ingredients against the pantry (rules live in match.js; the household's own fixes are in `rules`) ----
const isFresh = i => daysLeft(i.expires) >= 0;
const checkIngredient = ing => checkIngredientIn(ing, items, rules, isFresh);
const nearItem = ing => nearItemIn(ing, items, rules, isFresh);
const findItem = (ing, fresh = true) => findItemIn(ing, items, rules, isFresh, fresh);
// ---- tolerant parsing of model output ----
const asList = v => Array.isArray(v) ? v : typeof v === 'string' ? v.split(/\n|;|,(?![^()]*\))/).map(s => s.trim()).filter(Boolean) : [];

function parseJSONLoose(text) {
  if (typeof text !== 'string') return null;
  let t = text.replace(/```(?:json)?/gi, '').trim();
  const start = t.search(/[{[]/); if (start < 0) return null;
  t = t.slice(start);
  const end = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  const attempts = [t, end > 0 ? t.slice(0, end + 1) : t];
  for (const a of attempts) {
    for (const s of [a, a.replace(/,\s*([}\]])/g, '$1')]) { try { return JSON.parse(s); } catch (e) {} }
  }
  // truncated output: salvage every complete {...} object we can find
  const objs = [], stack = []; let from = -1, inStr = false, skip = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inStr) { if (skip) skip = false; else if (c === '\\') skip = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === '{' || c === '[') { if (c === '{' && stack[stack.length - 1] === '[' && stack.length <= 2) from = i; stack.push(c); }
    else if (c === '}' || c === ']') {
      const open = stack.pop();
      if (open === '{' && from >= 0 && stack[stack.length - 1] === '[' && stack.length <= 2) { try { objs.push(JSON.parse(t.slice(from, i + 1).replace(/,\s*([}\]])/g, '$1'))); } catch (e) {} from = -1; }
    }

// -> [{name, ingredients:[str], steps:[str]}] or null
function normalizeRecipes(data) {
  let arr = Array.isArray(data) ? data : null;
  if (!arr && data && typeof data === 'object') {
    arr = Object.values(data).find(v => Array.isArray(v) && v.length && v.every(x => x && typeof x === 'object' && !Array.isArray(x)));
    if (!arr && (data.name || data.title) && (data.ingredients || data.Ingredients)) arr = [data];
  }
  if (!arr) return null;
  const out = arr.map(r => {
    const get = (...ks) => { for (const k of ks) { const kk = Object.keys(r).find(x => x.toLowerCase() === k); if (kk) return r[kk]; } };
    const name = asText(get('name', 'title', 'recipe', 'dish', 'meal')).trim();
    const ingredients = asList(get('ingredients', 'ingredient_list', 'items')).map(x => asText(x).trim()).filter(Boolean);
    const steps = asList(get('steps', 'instructions', 'directions', 'method')).map(x => asText(x).replace(/^\s*(step\s*)?\d+[.):]\s*/i, '').trim()).filter(Boolean);
    return { name, ingredients, steps };

// Asks the model for JSON; if the reply can't be used, retries once with a stricter reminder.
async function llmJSON(prompt, max, accept) {

    const raw = await llm(attempt ? prompt + '\n\nIMPORTANT: your previous reply was not valid. Reply with ONLY the JSON object in the exact shape above — no other text.' : prompt, max, true);
    lastRaw = raw;

// ---- recipe matching without AI: ingredient overlap against a small bundled recipe book (works with no internet) ----
const BOOK = [
  ['Spinach & cheese omelette', 'eggs, spinach, cheese'], ['Veggie scramble', 'eggs, onion, bell pepper, tomato'], ['French toast', 'bread, eggs, milk'],
  ['Pancakes', 'flour, milk, eggs, butter'], ['Grilled cheese sandwich', 'bread, cheese, butter'], ['Tuna salad sandwich', 'tuna, bread, mayonnaise'],
  ['Garlic butter pasta', 'pasta, garlic, butter, cheese'], ['Creamy spinach pasta', 'pasta, spinach, milk, garlic'], ['Tomato pasta', 'pasta, tomato, garlic, onion'],
  ['Spaghetti bolognese', 'ground beef, pasta, tomato, onion, garlic'], ['Chicken stir-fry', 'chicken breast, bell pepper, onion, rice, soy sauce'],
  ['Chicken & rice bowl', 'chicken breast, rice, broccoli'], ['Fried rice', 'rice, eggs, carrot, onion, soy sauce'], ['Vegetable stir-fry', 'broccoli, carrot, bell pepper, rice, soy sauce'],
  ['Chicken quesadillas', 'tortillas, cheese, chicken breast, bell pepper'], ['Bean burritos', 'tortillas, black beans, rice, cheese, salsa'], ['Beef tacos', 'ground beef, tortillas, cheese, tomato, lettuce'],
  ['Mashed potatoes', 'potato, butter, milk'], ['Loaded baked potato', 'potato, butter, cheese'], ['Potato & egg hash', 'potato, onion, eggs'],
  ['Chicken soup', 'chicken breast, carrot, onion, potato'], ['Broccoli cheese soup', 'broccoli, cheese, milk, onion'], ['Yogurt parfait', 'yogurt, banana, oats'], ['Banana smoothie', 'banana, milk, yogurt'],
].map(([name, ings]) => ({ name, ings: ings.split(', ') }));
const urgencyOf = d => Math.max(1, 8 - d);
// Scores each book recipe by how many of its ingredients you have (expiring items count extra); expired items never count as "have".
function overlapMatches(limit = 8) {
  return BOOK.map(r => {
    const st = r.ings.map(i => checkIngredient(i));
    const have = r.ings.filter((_, k) => st[k] === 'have'), need = r.ings.filter((_, k) => st[k] !== 'have'), expired = r.ings.filter((_, k) => st[k] === 'expired');
    const urgency = have.reduce((s, ing) => { const it = findItem(ing); return s + (it ? urgencyOf(daysLeft(it.expires)) : 0); }, 0);
    return { ...r, have, need, expired, cover: have.length / r.ings.length, urgency };
  }).filter(r => r.have.length >= 1).sort((a, b) => (b.cover - a.cover) || (b.urgency - a.urgency)).slice(0, limit);
}
function overlapSection() {
  const m = overlapMatches();
  if (!m.length) return '<p class="muted">Nothing in the built-in recipe book matches your pantry yet — add a few staples (eggs, pasta, rice, cheese…).</p>';
  return `<p class="muted"><b>Ideas from your pantry</b> — ranked by how many ingredients you already have (no AI, works offline).</p>` + m.map(r => `<div class="card"><b>${esc(r.name)}</b>
    <div class="muted">You have ${r.have.length} of ${r.ings.length}: ${r.have.map(i => ingBtn(i, i)).join(', ')}</div>
    ${r.need.length ? `<div class="muted">Need: ${r.need.map(i => ingBtn(i, i)).join(', ')}</div>` : '<div class="muted">✅ Nothing else needed</div>'}</div>`).join('')
    + '<p class="muted">Tap an ingredient if it\'s matched wrong.</p>';
}

let recipesToken = 0;
async function viewRecipes() {
  const food = items.filter(i => !i.leftover).sort((a, b) => a.expires.localeCompare(b.expires));
  if (!food.length) { main.innerHTML = '<p class="muted">Add some groceries first, then I\'ll suggest recipes. (Leftovers are skipped — just eat those!)</p>'; return; }
  const off = ai.state === 'offline', my = ++recipesToken;
  // stale async results (user switched tab / AI state flipped meanwhile) must not overwrite the current screen
  const setHTML = (id, html) => { if (my === recipesToken && tab === 'recipes' && $(id)) $(id).innerHTML = html; };
  main.innerHTML = (off ? offlineCard() : `<div class="card"><button class="b" id="ai" style="width:100%">✨ Ask my AI for ideas using everything I have</button><div id="aiout" class="ai" style="margin-top:10px"></div></div>`)
    + `<div id="ovl">${off ? overlapSection() : ''}</div><div id="rlist"><p class="muted">Finding recipes…</p></div>`;
  if (off) $('retryai').onclick = async () => { $('retryai').textContent = 'Checking…'; stopAiRetry(); const p = await checkAI(); if (!p.ok) { $('retryai').textContent = 'Still offline — retry now'; } };
  else warm();   // start loading the model now so the button feels instant
  if ($('ai')) $('ai').onclick = async () => {
    const out = $('aiout');
    if (!items.some(isFresh)) { out.textContent = 'Everything in your pantry has expired — nothing safe to cook with.'; return; }
    out.textContent = 'Thinking…';
    let tick = 0; const stopTick = () => { clearInterval(tick); onAiPhase = null; };
    onAiPhase = p => { clearInterval(tick);
      if (p !== 'loading') { out.textContent = 'Thinking…'; return; }
      const t0 = Date.now(), upd = () => { out.innerHTML = `<b>⏳ Warming up AI…</b><div class="muted">Your PC is loading ${esc(getCfg().model)} from its hard drive. The first use after a break can take about 2 minutes; after that answers take a few seconds. (${Math.round((Date.now() - t0) / 1000)} s)</div>`; };
      upd(); tick = setInterval(upd, 1000); };
    try {
      const t0 = performance.now();
      const prompt0 = recipePrompt();
      let { val, retried } = await llmJSON(prompt0, 400, normalizeRecipes);
      stopTick();
      const bad = offList(val); let adjusted = false;
      if (bad.length) {   // the AI added things you don't have: ask once more, naming them (keeps the first answer if that fails)
        out.textContent = `Checking against your pantry: swapping out ${bad.length} ingredient${bad.length > 1 ? 's' : ''} you don't have…`;
        try { const r2 = await llmJSON(fixPrompt(prompt0, bad), 400, normalizeRecipes); if (offList(r2.val).length < bad.length) { val = r2.val; adjusted = true; } } catch (e) {}
      }
      aiRecipes = val; window.lastRecipeStats = { secs: (performance.now() - t0) / 1000, retried, offListFirst: bad.length, adjusted };
      out.innerHTML = renderRecipes() + `<div class="muted" style="margin-top:8px">— ${esc(lastModel)}${retried ? ' (needed a retry)' : ''}${adjusted ? ' · re-asked once to stick to your pantry' : ''}${lastFallbackWhy ? ' · used the fallback model because ' + esc(lastFallbackWhy) : ''}</div>`; wireSteps();
    } catch (e) {
      stopTick();
      out.innerHTML = `${esc(e.message)} ${e.raw ? '<details><summary class="muted">Show raw reply</summary><div class="ai muted">' + md(e.raw) + '</div></details>' : ''}`;
    }
  };
  try {
    const list = await getIngredients();
    const matched = [];
    for (const it of food) { const m = matchIngredient(it.name, list); if (m) matched.push({ it, m }); }
    if (!matched.length) { setHTML('rlist', '<p class="muted">Couldn\'t match your items to recipe ingredients. Try simpler names like "chicken" or "tomato".</p>'); return; }
    const meals = {};
    await Promise.all(matched.map(async ({ it, m }) => {
      const j = await (await fetch(MEAL + 'filter.php?i=' + encodeURIComponent(m.replace(/ /g, '_')))).json();
      const urgency = Math.max(1, 8 - daysLeft(it.expires));
      (j.meals || []).forEach(x => { const e = meals[x.idMeal] ||= { ...x, score: 0, uses: [] }; e.score += urgency; e.uses.push(it.name); });
    }));
    const top = Object.values(meals).sort((a, b) => b.score - a.score).slice(0, 10);
    // fetch each candidate's full ingredient list so we can show real overlap with the pantry
    await Promise.all(top.map(async r => {
      try {
        const d = (await (await fetch(MEAL + 'lookup.php?i=' + r.idMeal)).json()).meals?.[0], ings = [];
        for (let n = 1; n <= 20; n++) { const v = d?.['strIngredient' + n]; if (v && v.trim()) ings.push(v.trim()); }
        const st = ings.map(i => checkIngredient(i));
        r.total = ings.length; r.have = st.filter(s => s === 'have' || s === 'staple').length; r.need = ings.filter((_, k) => st[k] === 'missing' || st[k] === 'similar');
      } catch (e) {}
    }));
    const cov = r => r.total ? r.have / r.total : 0;
    top.sort((a, b) => (cov(b) * 10 + b.score / 10) - (cov(a) * 10 + a.score / 10));
    setHTML('rlist', `<p class="muted">Recipes from TheMealDB using: ${matched.map(x => esc(x.it.name)).join(', ')}. Ranked by how many ingredients you already have, then by what's expiring first.</p>` +
      (top.map(r => `<a class="card recipe" href="https://www.themealdb.com/meal/${r.idMeal}" target="_blank" rel="noopener">
        <img src="${r.strMealThumb}/small" alt=""><div><b>${esc(r.strMeal)}</b>
        <div class="muted">${r.total ? `You have ${r.have} of ${r.total} ingredients` : 'Uses: ' + r.uses.map(esc).join(', ')}</div>
        ${r.need && r.need.length ? `<div class="muted">Need: ${r.need.slice(0, 4).map(esc).join(', ')}${r.need.length > 4 ? ` +${r.need.length - 4} more` : ''}</div>` : ''}</div></a>`).join('') || '<p class="muted">No recipes found for those items.</p>'));
  } catch (e) {
    setHTML('rlist', '<p class="muted">Couldn\'t reach the online recipe list. Check your connection.</p>');
    if (!off) setHTML('ovl', overlapSection());   // still give ideas from the built-in recipe book
  }
}

// ---------- diagnostics: step-by-step checks of the AI connection ----------
async function runDiagnostics() {
  const box = $('diagout'), cfg = getCfg(), url = cfg.url.trim().replace(/\/+$/, '');
  const icon = { run: '⏳', pass: '✅', warn: '⚠️', fail: '❌', skip: '➖' };
  const rows = [];
  const draw = () => { box.innerHTML = rows.map(r => `<div class="card" style="margin:8px 0"><b>${icon[r.status]} ${esc(r.title)}</b>${r.detail ? `<div class="muted">${esc(r.detail)}</div>` : ''}${r.hint ? `<div style="margin-top:4px">👉 ${esc(r.hint)}</div>` : ''}</div>`).join(''); };
  const ctx = {};   // results shared between steps
  const steps = [
    ['1. The address looks right', async () => {
      let u; try { u = new URL(cfg.url.trim()); } catch (e) { return ['fail', `"${cfg.url}" isn't a valid web address.`, 'It should look like https://<your-pc>.<tailnet>.ts.net/ollama (or http://localhost:11434 when you are on the PC itself).']; }
      const local = ['localhost', '127.0.0.1', '[::1]'].includes(u.hostname);
      if (location.protocol === 'https:' && u.protocol === 'http:' && !local) return ['fail', `This page is HTTPS but ${u.origin} is plain http — the browser blocks that ("mixed content").`, 'Use the https:// Tailscale address.'];
      if (local && /iPhone|iPad|Android/i.test(navigator.userAgent)) return ['fail', 'On a phone, "localhost" means the phone itself, not your PC.', 'Use your PC\'s Tailscale address: https://<your-pc>.<tailnet>.ts.net/ollama'];
      if (u.hostname.endsWith('.ts.net') && !/\/ollama$/.test(u.pathname.replace(/\/+$/, ''))) return ['warn', `${u.origin}${u.pathname}`, 'Tailscale addresses for this setup normally end in /ollama.'];
      return ['pass', `${u.origin}${u.pathname === '/' ? '' : u.pathname}`];
    }],
    ['2. Reach your PC (Tailscale, then the proxy, then Ollama)', async () => {
      const t0 = performance.now(), p = await pingOllama(url, 8000); ctx.ping = p;
      if (p.ok) return ['pass', `Ollama answered in ${Math.round(performance.now() - t0)} ms.`];
      const cause = { network: 'No answer at all — the request never reached your PC.', 'proxy-down': 'Tailscale answered but nothing is running behind it.', 'host-rejected': 'Ollama refused the request.', 'wrong-path': 'Something answered, but not Ollama.', auth: 'Something answered, but it asks for a login.', 'not-ollama': 'Something answered, but not Ollama.', http: 'An unexpected reply came back.' }[p.kind];
      return ['fail', `${cause}${p.timedOut ? ' (timed out after 8 s)' : ''}${p.status ? ` HTTP ${p.status}.` : ''}`, p.hint];
    }],
    ['3. Browser permission check (CORS preflight)', async () => {
      try { const r = await fetch(url + '/api/show', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ model: cfg.model }) }); return ['pass', `The browser was allowed to send a JSON request (HTTP ${r.status}).`]; }
      catch (e) { return ['fail', 'The server is reachable but the browser blocked the request — a CORS (permission) problem.', 'On the PC set the environment variable OLLAMA_ORIGINS to * (or this site\'s address) and restart Ollama. If you use the proxy, make sure it is the latest tools/ollama-proxy.py.']; }
    }],
    ['4. Models are installed', async () => {
      const have = ctx.ping.models, miss = [cfg.model, cfg.fallback].filter(m => m && !have.includes(m));
      return miss.length ? ['fail', `Missing: ${miss.join(', ')}. Installed: ${have.join(', ') || 'none'}.`, `On the PC run: ${miss.map(m => 'ollama pull ' + m).join('  and  ')} — or change the model names above.`] : ['pass', `${cfg.model}${cfg.fallback ? ' and fallback ' + cfg.fallback : ''} are installed.`];
    }],
    ['5. Model is loaded in GPU memory', async () => {
      const r = await (await fetch(url + '/api/ps')).json().catch(() => null), m = (r?.models || []).find(x => x.name === cfg.model);
      ctx.loaded = !!m;
      return m ? ['pass', `${m.name}: ${(m.size_vram / 1e9).toFixed(1)} GB in GPU, context ${m.context_length}${m.expires_at ? ', stays loaded until ' + new Date(m.expires_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}.`]
        : ['warn', `${cfg.model} isn't in GPU memory right now.`, 'That\'s fine: the first request loads it (about 2 minutes, because the models are on a hard drive). Tap "Load model now", or just open the Recipes tab.'];
    }],
    ['6. Timed test generation', async () => {
      try {
        const ans = await llmOnce(cfg.model, 'Reply with only the number 4.', 10, cfg.firstToken + (ctx.loaded ? 0 : cfg.coldGrace), false), s = lastStats;
        const detail = `First word after ${s.ttft.toFixed(1)} s, finished in ${s.total.toFixed(1)} s${s.tps ? ', ' + s.tps.toFixed(0) + ' tokens/s' : ''}${s.loadSecs > 3 ? ', model load ' + s.loadSecs.toFixed(0) + ' s' : ''}. Answer: "${ans.trim().slice(0, 20)}"`;
        if (!/4/.test(ans)) return ['warn', detail, 'The model answered, but not as expected — try again or pick another model.'];
        if (s.ttft > cfg.firstToken && !s.loadSecs) return ['warn', detail, `Slower than your ${cfg.firstToken} s limit, so the app would switch to the fallback model. Close other programs that use the PC's GPU.`];
        return ['pass', detail];
      } catch (e) { return ['fail', e.message, 'If the model is cold, try "Load model now", wait a minute, and run the checks again.']; }
    }]
  ];
  $('diagrun').disabled = true;
  let stop = false;
  for (const [title] of steps) rows.push({ title, status: 'skip', detail: '', hint: '' });
  for (let i = 0; i < steps.length; i++) {
    if (stop) { rows[i].detail = 'Skipped — fix the problem above first.'; continue; }
    rows[i].status = 'run'; draw();
    try { const [status, detail, hint] = await steps[i][1](); Object.assign(rows[i], { status, detail: detail || '', hint: hint || '' }); }
    catch (e) { Object.assign(rows[i], { status: 'fail', detail: e.message, hint: 'Unexpected error — copy the results and send them over.' }); }
    if (rows[i].status === 'fail' && i <= 3) stop = true;   // later steps can't work until the connection and the model do
    draw();
  }
  const bad = rows.filter(r => r.status === 'fail').length, warn = rows.filter(r => r.status === 'warn').length;
  rows.push({ title: bad ? `${bad} problem${bad > 1 ? 's' : ''} found — start with the first ❌` : warn ? 'Working, with a note above' : 'Everything works', status: bad ? 'fail' : warn ? 'warn' : 'pass', detail: '', hint: '' });
  draw();
  if (bad === 0) { if (ai.state !== 'online') setAi(true); } else if (rows[1].status === 'fail') setAi(false, rows[1].hint);
  window.lastDiagText = `Use It Up diagnostics — ${new Date().toLocaleString()}\nPage: ${location.href}\nDevice: ${navigator.userAgent}\nAddress: ${cfg.url} | main ${cfg.model} | fallback ${cfg.fallback}\n\n` + rows.map(r => `${icon[r.status]} ${r.title}\n   ${r.detail}${r.hint ? '\n   -> ' + r.hint : ''}`).join('\n');
  $('diagrun').disabled = false;
}

// ---------- notifications (best effort; the banner/summary above are the dependable reminders) ----------
// Mobile browsers want ServiceWorkerRegistration.showNotification(); the plain Notification constructor can throw there.
async function showNote(title, body) {
  if (!('Notification' in window)) throw new Error('Notifications aren\'t supported here');
  if (Notification.permission !== 'granted') throw new Error('permission not granted yet — tap "Enable notifications"');
  const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
  if (reg && reg.showNotification) await reg.showNotification(title, { body, icon: 'icon-192.png', tag: 'useitup-daily' });
  else new Notification(title, { body });
}
// At most one per day, only when the app is opened. Never allowed to break startup.
async function remind() {
  try {
    const soon = soonItems(); if (!soon.length) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const today = isoLocal(new Date()); if (load('useitup.lastnote', '') === today) return;
    await showNote(`Eat soon: ${soon.length} item${soon.length > 1 ? 's' : ''}`, soon.slice(0, 4).map(i => `${i.name} (${relDay(daysLeft(i.expires))})`).join(', '));
    put('useitup.lastnote', today);
  } catch (e) { /* ignore: the in-app banner still shows */ }
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
remind();   // after render, so a notification problem can never leave the app blank
$('aipill').onclick = () => go('more');
// Invite links (#join=<url>|<code>) ask in the page itself, not with confirm(): iOS home-screen apps can swallow
// confirm() dialogs, and an in-page card can be tested automatically.
function joinFromLink() {
  const m = /^#join=(.+)$/.exec(location.hash); if (!m) return;
  let url = '', code = '';
  try { [url, code] = decodeURIComponent(m[1]).split('|'); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  const box = $('joinbox');
  if (!/^https?:\/\//.test(url || '') || !/^[A-Za-z0-9_-]{16,64}$/.test(code || '')) {
    box.innerHTML = `<div class="card join"><b>That invite link is broken</b><div class="muted">Ask for a fresh one: More → Shared pantry → Copy invite link.</div><div class="row"><button class="b alt" id="jno">OK</button></div></div>`;
  } else {
    const cur = syncCfg(), same = cur && cur.url === url && cur.code === code;
    box.innerHTML = `<div class="card join"><b>${same ? 'Already joined ✓' : 'Join the shared pantry?'}</b>
      <div class="muted">Server: ${esc(url)}</div>
      ${same ? '' : `<div class="muted" style="margin-top:4px">${items.length ? `The ${items.length} item${items.length > 1 ? 's' : ''} already on this phone will be added to the shared pantry.` : 'This phone will show the shared pantry.'}${cur ? ' This replaces the pantry this phone syncs with now.' : ''}</div>`}
      <div class="row">${same ? '<button class="b" id="jno">OK</button>' : '<button class="b" id="jyes">Join</button><button class="b alt" id="jno">Not now</button>'}</div></div>`;
    if ($('jyes')) $('jyes').onclick = () => { put(SKEY, { url, code }); box.innerHTML = ''; toast('Joined — syncing…'); sync.status = 'busy'; paintSync(); syncNow(); };
  }
  $('jno').onclick = () => { box.innerHTML = ''; };
}
joinFromLink();
window.addEventListener('hashchange', joinFromLink);   // invite opened while the app is already open
syncNow();   // pull the shared pantry (if sync is set up)
checkAI();  // learn whether the AI is reachable (starts the background retry if not)
</script>
