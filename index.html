<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Use It Up</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#222;--mute:#777;--green:#2f7d4f;--amber:#e0a100;--red:#c8372d;--line:#e4e2da}
@media (prefers-color-scheme:dark){:root{--bg:#161814;--card:#22251f;--ink:#eee;--mute:#999;--line:#33362e}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
header{background:var(--green);color:#fff;padding:14px 16px;font-size:20px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mute);font-size:14px}
nav button.on{color:var(--green);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.item{display:flex;align-items:center;gap:8px}
.item .name{flex:1;font-weight:600}
.item .qty{color:var(--mute);font-weight:400}
.badge{padding:3px 9px;border-radius:99px;font-size:13px;color:#fff;white-space:nowrap}
.ok{background:var(--green)}.soon{background:var(--amber)}.bad{background:var(--red)}
button.b,input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.b{background:var(--green);color:#fff;border:0;font-weight:600}
button.b.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.b.sm{padding:6px 10px;font-size:14px}
button.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row>*{flex:1}
label{font-size:13px;color:var(--mute);display:block;margin-top:8px}
input{width:100%}
video{width:100%;border-radius:12px;background:#000}
.banner{background:#fff3cd;color:#5c4400;border-radius:12px;padding:10px 12px;margin:10px 0}
.muted{color:var(--mute);font-size:14px}
.recipe{display:flex;gap:10px;text-decoration:none;color:inherit}
.recipe img{width:76px;height:76px;border-radius:10px;object-fit:cover}
.ai{white-space:pre-wrap}
.hide{display:none}
</style>
</head>
<body>
<header>🥕 Use It Up</header>
<main id="main"></main>
<nav>
  <button data-t="list">Pantry</button>
  <button data-t="add">Add</button>
  <button data-t="recipes">Recipes</button>
  <button data-t="more">More</button>
</nav>

<script>
// ---------- storage ----------
const KEY = 'useitup.items.v1', HKEY = 'useitup.hist.v1', CKEY = 'useitup.llm';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let items = load(KEY, []), hist = load(HKEY, []);
const save = () => { put(KEY, items); put(HKEY, hist); };
const getCfg = () => ({ url: 'http://localhost:11434', model: 'qwen2.5:14b', fallback: 'qwen2.5:7b', timeout: 90, ...load(CKEY, {}) });
const uid = () => Math.random().toString(36).slice(2, 9);

// ---------- dates ----------
const DAY = 864e5;
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = n => { const d = today0(); d.setDate(d.getDate() + n); return isoLocal(d); };
const daysLeft = iso => Math.round((new Date(iso + 'T00:00:00') - today0()) / DAY);
function badge(iso) {
  const n = daysLeft(iso);
  const cls = n < 0 ? 'bad' : n <= 2 ? 'soon' : 'ok';
  const txt = n < 0 ? `expired ${-n}d ago` : n === 0 ? 'today!' : n === 1 ? 'tomorrow' : `${n} days`;
  return `<span class="badge ${cls}">${txt}</span>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

// ---------- Local AI (Ollama running on your own PC) ----------
let lastModel = '';
async function llmOnce(model, prompt, max, secs, json = false) {
  const { url } = getCfg();
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), secs * 1000);
  let r;
  try {
    r = await fetch(url.replace(/\/+$/, '') + '/api/chat', {
      method: 'POST', signal: ctl.signal,
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ model, stream: false, keep_alive: '30m', ...(json ? { format: 'json' } : {}), messages: [{ role: 'user', content: prompt }], options: { num_predict: max, temperature: json ? 0.3 : 0.5 } })
    });
  } catch (e) {
    if (e.name === 'AbortError') { const err = new Error(`${model} took longer than ${secs}s`); err.retry = true; throw err; }
    const err = new Error(`Can't reach Ollama at ${url}. Is it running on your PC, and is the address right? (See More.)`); err.fatal = true; throw err;
  } finally { clearTimeout(timer); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(j.error || ('HTTP ' + r.status)); err.retry = true; throw err; }  // e.g. model missing or out of memory
  lastModel = model;
  return j.message?.content || '';
}
// Loads the model into GPU memory in the background so the first real request isn't slow.
let warmedAt = 0;
function warm() {
  if (Date.now() - warmedAt < 5 * 60e3) return;
  warmedAt = Date.now();
  const { url, model } = getCfg();
  fetch(url.replace(/\/+$/, '') + '/api/generate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ model, keep_alive: '30m' }) }).catch(() => { warmedAt = 0; });
}
// Tries the main model; on timeout / out-of-memory / missing model, retries once with the fallback model.
async function llm(prompt, max = 900, json = false) {
  const { model, fallback, timeout } = getCfg();
  try { return await llmOnce(model, prompt, max, timeout, json); }
  catch (e) {
    if (!e.retry || !fallback || fallback === model) throw e;
    return await llmOnce(fallback, prompt, max, timeout, json).catch(e2 => { throw new Error(`${e.message}; fallback ${fallback} also failed: ${e2.message}`); });
  }
}

// ---------- views ----------
let tab = 'list';
let draft = { name: '', qty: '', expires: addDays(7), leftover: false, barcode: '' };
const main = $('main');
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));
function go(t) { stopScan(); tab = t; render(); }
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  ({ list: viewList, add: viewAdd, recipes: viewRecipes, more: viewMore })[tab]();
}

function finish(id, outcome) {
  const it = items.find(i => i.id === id); if (!it) return;
  hist.push({ name: it.name, outcome, date: isoLocal(new Date()) });
  items = items.filter(i => i.id !== id); save(); render();
}

function viewList() {
  const sorted = [...items].sort((a, b) => a.expires.localeCompare(b.expires));
  const urgent = sorted.filter(i => daysLeft(i.expires) <= 2);
  let h = '';
  if (urgent.length) h += `<div class="banner"><b>Eat soon:</b> ${urgent.map(i => esc(i.name)).join(', ')}</div>`;
  if (!sorted.length) h += `<p class="muted">Nothing here yet. Tap <b>Add</b> to scan groceries or log leftovers.</p>`;
  h += sorted.map(i => `<div class="card item">
    <div class="name">${i.leftover ? '🍱 ' : ''}${esc(i.name)}${i.qty ? ` <span class="qty">×${esc(i.qty)}</span>` : ''}</div>${badge(i.expires)}
    <button class="x" title="Ate it" data-ate="${i.id}">😋</button>
    <button class="x" title="Threw it out" data-toss="${i.id}">🗑️</button></div>`).join('');
  if (sorted.length) h += `<p class="muted">😋 = ate it · 🗑️ = threw it out</p>`;
  main.innerHTML = h;
  main.querySelectorAll('[data-ate]').forEach(b => b.onclick = () => finish(b.dataset.ate, 'ate'));
  main.querySelectorAll('[data-toss]').forEach(b => b.onclick = () => finish(b.dataset.toss, 'tossed'));
}

// ---------- scanning ----------
let stream = null, scanTimer = null, zxControls = null;
function stopScan() {
  clearInterval(scanTimer); scanTimer = null;
  if (zxControls) { try { zxControls.stop(); } catch (e) {} zxControls = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
function loadZXing() {
  return new Promise((res, rej) => {
    if (window.ZXingBrowser) return res();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Could not load the scanner library (offline?).'));
    document.head.appendChild(s);
  });
}
function gotCode(c) {
  stopScan(); $('code').value = c; draft.barcode = c; $('vid').classList.add('hide'); lookup(c);
}
async function startScan() {
  const msg = $('msg'), vid = $('vid');
  if (!navigator.mediaDevices?.getUserMedia) { msg.textContent = 'Camera needs a secure (https) page. Type the barcode instead.'; return; }
  try {
    vid.classList.remove('hide');
    if ('BarcodeDetector' in window) {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      vid.srcObject = stream; await vid.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      msg.textContent = 'Point at a barcode…';
      scanTimer = setInterval(async () => {
        try { const r = await det.detect(vid); if (r.length) gotCode(r[0].rawValue); } catch (e) {}
      }, 300);
    } else {
      msg.textContent = 'Loading scanner…';
      await loadZXing();
      const reader = new ZXingBrowser.BrowserMultiFormatReader();
      msg.textContent = 'Point at a barcode…';
      zxControls = await reader.decodeFromConstraints({ video: { facingMode: 'environment' } }, vid, (result) => { if (result) gotCode(result.getText()); });
    }
  } catch (e) { vid.classList.add('hide'); msg.textContent = 'Camera unavailable: ' + e.message; }
}

function viewAdd() {
  main.innerHTML = `
  <div class="card">
    <div class="row"><button class="b" id="scan">📷 Scan barcode</button>
    <button class="b alt" id="left">🍱 Log leftovers</button></div>
    <video id="vid" class="hide" playsinline muted></video>
    <div id="msg" class="muted"></div>
    <label>Barcode (or type it)</label>
    <div class="row"><input id="code" inputmode="numeric" placeholder="e.g. 3017620422003" value="${esc(draft.barcode)}"><button class="b alt" id="look" style="flex:0">Look up</button></div>
    <label>Name</label><input id="name" value="${esc(draft.name)}" placeholder="e.g. Chicken breast">
    <label>Quantity (optional)</label><input id="qty" value="${esc(draft.qty)}" placeholder="e.g. 2">
    <label>Use by</label><input id="exp" type="date" value="${draft.expires}">
    <div class="row">
      ${[['+2d',2],['+1w',7],['+2w',14],['+1mo',30]].map(([l,n]) => `<button class="b alt" data-q="${n}">${l}</button>`).join('')}
    </div>
    <button class="b alt" id="est" style="width:100%">✨ Ask my AI how long it keeps</button>
    <button class="b" id="save" style="width:100%;margin-top:8px">Save to pantry</button>
  </div>`;
  const sync = () => { draft.name = $('name').value; draft.qty = $('qty').value; draft.expires = $('exp').value; draft.barcode = $('code').value; };
  main.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { sync(); draft.expires = addDays(+b.dataset.q); viewAdd(); });
  $('left').onclick = () => { sync(); draft.leftover = true; draft.expires = addDays(4); if (!draft.name) draft.name = 'Leftovers: '; viewAdd(); $('name').focus(); };
  $('look').onclick = () => { sync(); lookup(draft.barcode); };
  $('scan').onclick = startScan;
  $('est').onclick = async () => {
    sync(); if (!draft.name.trim()) { $('msg').textContent = 'Enter a name first.'; return; }
    $('msg').textContent = 'Asking your AI…';
    try {
      const t = await llm(`How many days will "${draft.name}" stay safe to eat ${draft.leftover ? 'as a cooked leftover in the fridge' : 'when bought fresh and stored properly (in the fridge if it needs it)'}? Be conservative. Reply with only a whole number of days, nothing else.`, 20);
      const n = parseInt(t.match(/\d+/)?.[0], 10);
      if (!n || n > 400) throw new Error('No clear answer');
      $('exp').value = draft.expires = addDays(n); $('msg').textContent = `Estimate: about ${n} days (${lastModel}). Adjust if the package says otherwise.`;
    } catch (e) { $('msg').textContent = 'AI error: ' + e.message; }
  };
  $('save').onclick = () => {
    sync();
    if (!draft.name.trim() || !draft.expires) { $('msg').textContent = 'Need a name and a date.'; return; }
    items.push({ id: uid(), name: draft.name.trim(), qty: draft.qty.trim(), expires: draft.expires, leftover: draft.leftover, barcode: draft.barcode });
    save(); draft = { name: '', qty: '', expires: addDays(7), leftover: false, barcode: '' }; go('list');
  };
  if (draft.leftover) $('msg').textContent = 'Logging a leftover — default 4 days. Adjust the date if needed.';
}

async function lookup(code) {
  const msg = $('msg');
  if (!code) { msg.textContent = 'Enter a barcode first.'; return; }
  msg.textContent = 'Looking up…';
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,categories_tags`);
    const j = await r.json();
    if (j.status !== 1) { msg.textContent = 'Not found — type the name yourself.'; return; }
    const p = j.product;
    $('name').value = draft.name = [p.product_name, p.brands && '(' + p.brands.split(',')[0] + ')'].filter(Boolean).join(' ');
    draft.barcode = code; draft.leftover = false;
    const cats = (p.categories_tags || []).join(' ');
    const days = /meat|poultry|fish|seafood/.test(cats) ? 3 : /milk|dairy|yogurt|cheese/.test(cats) ? 10 : /bread|bakery/.test(cats) ? 5 : /fruit|vegetable/.test(cats) ? 5 : 14;
    $('exp').value = draft.expires = addDays(days);
    msg.textContent = `Found it. I guessed ${days} days — change to match the package.`;
  } catch (e) { msg.textContent = 'Lookup failed (offline?). Type the name yourself.'; }
}

// ---------- recipes ----------
const MEAL = 'https://www.themealdb.com/api/json/v1/1/';
let ingList = null;
async function getIngredients() {
  if (ingList) return ingList;
  ingList = load('useitup.ing', null);
  if (!ingList) {
    const j = await (await fetch(MEAL + 'list.php?i=list')).json();
    ingList = j.meals.map(m => m.strIngredient.toLowerCase());
    put('useitup.ing', ingList);
  }
  return ingList;
}
const sing = w => w.replace(/ies$/, 'y').replace(/(ch|sh|x|s)es$/, '$1').replace(/s$/, '');
function matchIngredient(name, list) {
  const words = name.toLowerCase().replace(/\(.*?\)/g, '').split(/[^a-z]+/).filter(w => w.length > 2).map(sing);
  for (const w of words.slice().reverse()) { const exact = list.find(i => i === w); if (exact) return exact; }
  const phrase = words.join(' ');
  return list.find(i => phrase.includes(i) && i.length > 3) || null;
}
// ---- check AI recipe ingredients against the pantry ----
// Matching rules (see README): an ingredient is "in the pantry" only if every meaningful word of it is part of
// the pantry item's name (so "chicken broth" != "chicken breast"), AND the pantry item's own form/variety words
// (powder, sauce, almond, peanut…) also appear in the ingredient (so "garlic" != "garlic powder").
// Exception: an ingredient may name a cut ("chicken thighs") that a generic pantry item ("Chicken") doesn't specify.
const SYN = [[/\bscallions?\b/g, 'green onion'], [/\bcilantro\b/g, 'coriander'], [/\bcourgettes?\b/g, 'zucchini'], [/\baubergines?\b/g, 'eggplant'],
  [/\bcapsicums?\b/g, 'bell pepper'], [/\bchilli\b/g, 'chili'], [/\byoghurt\b/g, 'yogurt'], [/\bgarbanzo( beans?)?\b/g, 'chickpea'], [/\b(stock|bouillon)\b/g, 'broth']];
const STOP = new Set('whole fresh cooked leftover sliced slice raw ground large small baby organic the and with of boneless skinless chopped diced minced shredded grated frozen canned extra virgin low fat free unsalted salted dried cup tbsp tsp tablespoon teaspoon clove pound lb oz ounce pinch handful can package piece dash bunch head stick medium half optional taste some few plain lean thin thick ripe good quality cut bite size little more for serving about any your favorite leaf cubed crushed peeled trimmed halved rinsed drained melted softened beaten quartered torn mashed sifted toasted steamed boiled warm cold finely roughly thinly freshly splash drizzle sprinkle dollop knob'.split(' '));
const FORM = new Set('powder broth sauce paste juice flour vinegar oil ketchup jam jelly syrup soup puree extract flake cream seasoning mix cube dressing gravy salsa relish starch zest butter'.split(' '));
const ALT = new Set('almond coconut soy oat peanut cashew hazelnut sweet sour smoked'.split(' '));
const CUT = new Set('breast thigh wing drumstick leg fillet loin steak chop rib tender tenderloin shoulder belly roast'.split(' '));
const sing2 = w => /(us|ss|is)$/.test(w) ? w : w === 'leaves' ? 'leaf' : w.replace(/ies$/, 'y').replace(/oes$/, 'o').replace(/(ch|sh|x|z)es$/, '$1').replace(/s$/, '');
const words = s => { let t = s.toLowerCase().replace(/\(.*?\)/g, ' '); SYN.forEach(([re, to]) => { t = t.replace(re, to); });
  return t.split(/[^a-z]+/).filter(w => w.length > 2).map(sing2).filter(w => !STOP.has(w)); };
function itemMatches(ingW, itemName) {
  const iw = words(itemName); if (!iw.length || !ingW.length) return false;
  const itemHasCut = iw.some(w => CUT.has(w));
  if (ingW.some(w => !iw.includes(w) && !(CUT.has(w) && !itemHasCut))) return false;   // unexplained extra word in the ingredient
  if (iw.some(w => (FORM.has(w) || ALT.has(w)) && !ingW.includes(w))) return false;   // pantry item is a specific form the ingredient doesn't ask for
  return ingW.some(w => iw.includes(w));
}
function isStaple(s) {
  s = s.toLowerCase();
  // "pepper" alone / black / white / cracked / ground pepper is a seasoning; bell, chili, ghost… pepper is a vegetable
  if (/\b(black|white|cracked|ground|cayenne)\s+pepper\b|\bsalt\s*(and|&)\s*pepper\b|\bpepper\s+flakes?\b|^\W*(\d[\d\/. ]*\s*(tsp|tbsp|teaspoons?|tablespoons?|pinch(es)?)?\s*(of\s+)?)?pepper\W*$/.test(s)) return true;
  return /(^|\W)(oil|salt|water|spices?|seasoning|paprika|cumin|oregano|thyme|basil|cinnamon|cayenne|turmeric|nutmeg|rosemary|herbs?|garlic powder|onion powder|chili powder|chili flakes?)(\W|$)/.test(s);
}
const isFresh = i => daysLeft(i.expires) >= 0;
// -> 'have' | 'expired' | 'staple' | 'similar' (right ingredient, wrong form) | 'missing'
function checkIngredient(ing) {
  const w = words(ing);
  if (!w.length) return 'staple';
  if (items.some(it => isFresh(it) && itemMatches(w, it.name))) return 'have';
  if (items.some(it => !isFresh(it) && itemMatches(w, it.name))) return 'expired';
  if (isStaple(ing)) return 'staple';
  return nearItem(ing) ? 'similar' : 'missing';
}
const nearItem = ing => { const w = words(ing); return items.find(it => isFresh(it) && words(it.name).some(x => w.includes(x))) || null; };
// ---- tolerant parsing of model output ----
const asList = v => Array.isArray(v) ? v : typeof v === 'string' ? v.split(/\n|;|,(?![^()]*\))/).map(s => s.trim()).filter(Boolean) : [];
const asText = v => typeof v === 'string' ? v : v && typeof v === 'object' ? (v.name || v.item || v.ingredient || v.text || v.step || v.title || '') : String(v ?? '');
function parseJSONLoose(text) {
  if (typeof text !== 'string') return null;
  let t = text.replace(/```(?:json)?/gi, '').trim();
  const start = t.search(/[{[]/); if (start < 0) return null;
  t = t.slice(start);
  const end = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  const attempts = [t, end > 0 ? t.slice(0, end + 1) : t];
  for (const a of attempts) {
    for (const s of [a, a.replace(/,\s*([}\]])/g, '$1')]) { try { return JSON.parse(s); } catch (e) {} }
  }
  // truncated output: salvage every complete {...} object we can find
  const objs = [], stack = []; let from = -1, inStr = false, skip = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inStr) { if (skip) skip = false; else if (c === '\\') skip = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === '{' || c === '[') { if (c === '{' && stack[stack.length - 1] === '[' && stack.length <= 2) from = i; stack.push(c); }
    else if (c === '}' || c === ']') {
      const open = stack.pop();
      if (open === '{' && from >= 0 && stack[stack.length - 1] === '[' && stack.length <= 2) { try { objs.push(JSON.parse(t.slice(from, i + 1).replace(/,\s*([}\]])/g, '$1'))); } catch (e) {} from = -1; }
    }
  }
  return objs.length ? { recipes: objs } : null;
}
// -> [{name, ingredients:[str], steps:[str]}] or null
function normalizeRecipes(data) {
  let arr = Array.isArray(data) ? data : null;
  if (!arr && data && typeof data === 'object') {
    arr = Object.values(data).find(v => Array.isArray(v) && v.length && v.every(x => x && typeof x === 'object' && !Array.isArray(x)));
    if (!arr && (data.name || data.title) && (data.ingredients || data.Ingredients)) arr = [data];
  }
  if (!arr) return null;
  const out = arr.map(r => {
    const get = (...ks) => { for (const k of ks) { const kk = Object.keys(r).find(x => x.toLowerCase() === k); if (kk) return r[kk]; } };
    const name = asText(get('name', 'title', 'recipe', 'dish', 'meal')).trim();
    const ingredients = asList(get('ingredients', 'ingredient_list', 'items')).map(x => asText(x).trim()).filter(Boolean);
    const steps = asList(get('steps', 'instructions', 'directions', 'method')).map(x => asText(x).replace(/^\s*(step\s*)?\d+[.):]\s*/i, '').trim()).filter(Boolean);
    return { name, ingredients, steps };
  }).filter(r => r.name && r.ingredients.length);
  return out.length ? out.slice(0, 4) : null;
}
// Asks the model for JSON; if the reply can't be used, retries once with a stricter reminder.
async function llmJSON(prompt, max, accept) {
  let lastRaw = '';
  for (let attempt = 0; attempt < 2; attempt++) {
    const raw = await llm(attempt ? prompt + '\n\nIMPORTANT: your previous reply was not valid. Reply with ONLY the JSON object in the exact shape above — no other text.' : prompt, max, true);
    lastRaw = raw;
    const val = accept(parseJSONLoose(raw));
    if (val) return { val, retried: attempt > 0, raw };
  }
  const err = new Error('The AI returned an unusable reply twice.'); err.raw = lastRaw; throw err;
}
const acceptSteps = d => { const s = asList(d && !Array.isArray(d) ? (d.steps || d.instructions || d.directions) : d).map(x => asText(x).replace(/^\s*(step\s*)?\d+[.):]\s*/i, '').trim()).filter(Boolean); return s.length ? s.slice(0, 8) : null; };

// Only fresh items are listed (expired ones are left out so the model isn't tempted); stage 1 asks for names + ingredients only.
function recipePrompt() {
  const lines = items.filter(isFresh).sort((a, b) => a.expires.localeCompare(b.expires))
    .map(i => `- ${i.name}${i.qty ? ' (x' + i.qty + ')' : ''}${i.leftover ? ' [cooked leftover]' : ''}: ${daysLeft(i.expires)} days left`).join('\n');
  return `Pantry (soonest-expiring first):\n${lines}\n\nSuggest 3 simple meals that use the soonest-expiring items. For a cooked leftover, suggest how to reheat or repurpose it. STRICT RULE: ingredients may only be pantry items above plus oil, salt, pepper, water and common spices — never add anything else (no eggs, onions, cheese, etc. unless listed).\n\nReply with JSON only: {"recipes":[{"name":"...","ingredients":["every ingredient, including staples"]}]}`;
}
let aiRecipes = [];
function renderRecipes() {
  const icon = { have: '✅', staple: '🧂', similar: '⚠️', missing: '⚠️', expired: '⛔' };
  return aiRecipes.map((r, idx) => {
    const ings = r.ingredients.map(i => [i, checkIngredient(i)]);
    const need = ings.filter(x => x[1] === 'missing' || x[1] === 'similar').map(([n, s]) => { const near = s === 'similar' && nearItem(n); return near ? `${n} (you have “${near.name}”, but a different form)` : n; });
    const expired = ings.filter(x => x[1] === 'expired').map(x => x[0]);
    return `<div class="card"><b>${esc(r.name)}</b>
      ${need.length ? `<div class="banner">⚠️ Not on your list — you'd need: <b>${need.map(esc).join('; ')}</b></div>` : expired.length ? '' : '<div class="muted" style="margin:6px 0">✅ Everything is in your pantry (plus basic staples).</div>'}
      ${expired.length ? `<div class="banner" style="background:#f8d7da;color:#721c24">⛔ Uses expired item: <b>${expired.map(esc).join(', ')}</b> — don't use it.</div>` : ''}
      <div class="muted">${ings.map(([n, s]) => `${icon[s]} ${esc(n)}`).join(' · ')}</div>
      <div data-steps="${idx}">${r.steps && r.steps.length
        ? `<ol style="margin:8px 0 0 18px;padding:0">${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`
        : `<button class="b alt sm" style="margin-top:8px" data-getsteps="${idx}">Show steps</button>`}</div></div>`;
  }).join('') + `<div class="muted">✅ in pantry · 🧂 basic staple · ⚠️ not on your list · ⛔ expired</div>`;
}
async function getSteps(idx) {
  const r = aiRecipes[idx], box = document.querySelector(`[data-steps="${idx}"]`);
  box.innerHTML = '<span class="muted">Writing steps…</span>';
  try {
    const { val } = await llmJSON(`Recipe: ${r.name}\nIngredients: ${r.ingredients.join(', ')}\n\nWrite 4 to 6 short numbered cooking steps using ONLY those ingredients. Reply with JSON only: {"steps":["...","..."]}`, 500, acceptSteps);
    r.steps = val;
  } catch (e) { box.innerHTML = `<span class="muted">Couldn't write steps (${esc(e.message)}). </span><button class="b alt sm" data-getsteps="${idx}">Try again</button>`; wireSteps(); return; }
  $('aiout').innerHTML = renderRecipes() + `<div class="muted" style="margin-top:8px">— ${esc(lastModel)}</div>`; wireSteps();
}
const wireSteps = () => document.querySelectorAll('[data-getsteps]').forEach(b => b.onclick = () => getSteps(+b.dataset.getsteps));
const md = s =>esc(s).replace(/^#{1,6}\s*(.+)$/gm, '<b>$1</b>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

async function viewRecipes() {
  const food = items.filter(i => !i.leftover).sort((a, b) => a.expires.localeCompare(b.expires));
  if (!food.length) { main.innerHTML = '<p class="muted">Add some groceries first, then I\'ll suggest recipes. (Leftovers are skipped — just eat those!)</p>'; return; }
  main.innerHTML = `<div class="card"><button class="b" id="ai" style="width:100%">✨ Ask my AI for ideas using everything I have</button><div id="aiout" class="ai" style="margin-top:10px"></div></div><div id="rlist"><p class="muted">Finding recipes…</p></div>`;
  warm();   // start loading the model now so the button feels instant
  $('ai').onclick = async () => {
    const out = $('aiout');
    if (!items.some(isFresh)) { out.textContent = 'Everything in your pantry has expired — nothing safe to cook with.'; return; }
    out.textContent = 'Thinking…';
    try {
      const t0 = performance.now();
      const { val, retried } = await llmJSON(recipePrompt(), 400, normalizeRecipes);
      aiRecipes = val; window.lastRecipeStats = { secs: (performance.now() - t0) / 1000, retried };
      out.innerHTML = renderRecipes() + `<div class="muted" style="margin-top:8px">— ${esc(lastModel)}${retried ? ' (needed a retry)' : ''}</div>`; wireSteps();
    } catch (e) {
      out.innerHTML = `${esc(e.message)} ${e.raw ? '<details><summary class="muted">Show raw reply</summary><div class="ai muted">' + md(e.raw) + '</div></details>' : ''}`;
    }
  };
  try {
    const list = await getIngredients();
    const matched = [];
    for (const it of food) { const m = matchIngredient(it.name, list); if (m) matched.push({ it, m }); }
    if (!matched.length) { $('rlist').innerHTML = '<p class="muted">Couldn\'t match your items to recipe ingredients. Try simpler names like "chicken" or "tomato".</p>'; return; }
    const meals = {};
    await Promise.all(matched.map(async ({ it, m }) => {
      const j = await (await fetch(MEAL + 'filter.php?i=' + encodeURIComponent(m.replace(/ /g, '_')))).json();
      const urgency = Math.max(1, 8 - daysLeft(it.expires));
      (j.meals || []).forEach(x => { const e = meals[x.idMeal] ||= { ...x, score: 0, uses: [] }; e.score += urgency; e.uses.push(it.name); });
    }));
    const top = Object.values(meals).sort((a, b) => b.score - a.score).slice(0, 12);
    $('rlist').innerHTML = `<p class="muted">Matched: ${matched.map(x => esc(x.it.name)).join(', ')}. Ranked by what's expiring first.</p>` +
      (top.map(r => `<a class="card recipe" href="https://www.themealdb.com/meal/${r.idMeal}" target="_blank" rel="noopener">
        <img src="${r.strMealThumb}/small" alt=""><div><b>${esc(r.strMeal)}</b><div class="muted">Uses: ${r.uses.map(esc).join(', ')}</div></div></a>`).join('') || '<p class="muted">No recipes found for those items.</p>');
  } catch (e) { $('rlist').innerHTML = '<p class="muted">Couldn\'t reach the recipe service. Check your connection.</p>'; }
}

// ---------- more: history + settings ----------
function viewMore() {
  const cutoff = isoLocal(new Date(Date.now() - 30 * DAY));
  const recent = hist.filter(h => h.date >= cutoff);
  const ate = recent.filter(h => h.outcome === 'ate').length, tossed = recent.length - ate;
  const last = [...hist].reverse().slice(0, 10);
  main.innerHTML = `
  <div class="card"><b>Last 30 days</b>
    <p>😋 Used up: <b>${ate}</b> &nbsp; 🗑️ Wasted: <b>${tossed}</b></p>
    ${last.length ? '<div class="muted">' + last.map(h => `${h.outcome === 'ate' ? '😋' : '🗑️'} ${esc(h.name)} <span>(${h.date})</span>`).join('<br>') + '</div>' : '<span class="muted">Nothing logged yet.</span>'}
  </div>
  <div class="card"><b>AI helper (Ollama on your PC)</b>
    <p class="muted">Tailored recipes and shelf-life estimates run on your own computer — nothing leaves your network and there's no key. On the PC itself the default address works. On a phone, enter your PC's address (see the README).</p>
    <label>Ollama address</label><input id="curl" value="${esc(getCfg().url)}" autocapitalize="off" autocorrect="off">
    <label>Main model</label><input id="cmodel" list="models" value="${esc(getCfg().model)}" autocapitalize="off" autocorrect="off"><datalist id="models"></datalist>
    <label>Fallback model (used if the main one is slow, out of memory or missing)</label><input id="cfall" list="models" value="${esc(getCfg().fallback)}" autocapitalize="off" autocorrect="off">
    <label>Switch to fallback after (seconds)</label><input id="ctime" type="number" min="10" max="600" value="${getCfg().timeout}">
    <div class="row"><button class="b" id="csave">Save &amp; test</button><button class="b alt" id="creset">Reset</button></div>
    <div id="kmsg" class="muted"></div>
  </div>
  <div class="card"><b>Reminders</b>
    <p class="muted">Get a notification when something expires within a day (shown when you open the app).</p>
    <button class="b alt" id="notif">Enable notifications</button>
  </div>`;
  $('csave').onclick = async () => {
    const url = $('curl').value.trim() || 'http://localhost:11434', model = $('cmodel').value.trim() || 'qwen2.5:14b';
    const fallback = $('cfall').value.trim(), timeout = Math.max(10, +$('ctime').value || 90);
    put(CKEY, { url, model, fallback, timeout }); $('kmsg').textContent = 'Testing…';
    try {
      const j = await (await fetch(url.replace(/\/+$/, '') + '/api/tags')).json();
      const names = (j.models || []).map(m => m.name);
      $('models').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
      const miss = [model, fallback].filter(m => m && !names.includes(m));
      $('kmsg').textContent = miss.length ? `Connected, but not installed: ${miss.join(', ')}. Installed: ${names.join(', ') || 'none'}` : `Connected ✓ — ${model}${fallback ? ' (fallback ' + fallback + ')' : ''} ready.`;
    } catch (e) { $('kmsg').textContent = `Can't reach Ollama at ${url}.`; }
  };
  $('creset').onclick = () => { try { localStorage.removeItem(CKEY); } catch (e) {} viewMore(); };
  $('notif').onclick = async () => {
    if (!('Notification' in window)) { $('notif').textContent = 'Not supported here'; return; }
    const p = await Notification.requestPermission(); $('notif').textContent = p === 'granted' ? 'Enabled ✓' : 'Blocked in browser settings';
  };
}

// ---------- reminders ----------
function remind() {
  const urgent = items.filter(i => daysLeft(i.expires) <= 1);
  if (urgent.length && 'Notification' in window && Notification.permission === 'granted')
    new Notification('Eat soon!', { body: urgent.map(i => i.name).join(', ') });
}
remind();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
